server.port=8081
spring.application.name=auth-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:TestJwtSecretKeyForAutomatedUnitTestVerificationOnly1234567890}
jwt.expiration=86400000

resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:TravelEasy <notifications@mailer.gsrgroups.tech>}
app.frontend.url=http://localhost:4200
