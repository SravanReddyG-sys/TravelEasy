server.port=8085
spring.application.name=payment-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8084}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

payment.outbox.publisher.enabled=${PAYMENT_OUTBOX_PUBLISHER_ENABLED:true}
payment.outbox.publisher.batch-size=${PAYMENT_OUTBOX_PUBLISHER_BATCH_SIZE:20}
payment.outbox.publisher.fixed-delay=${PAYMENT_OUTBOX_PUBLISHER_FIXED_DELAY:2000}
payment.outbox.publisher.lease-seconds=${PAYMENT_OUTBOX_PUBLISHER_LEASE_SECONDS:60}
payment.outbox.publisher.max-retries=${PAYMENT_OUTBOX_PUBLISHER_MAX_RETRIES:5}
payment.outbox.publisher.connect-timeout-ms=${PAYMENT_OUTBOX_PUBLISHER_CONNECT_TIMEOUT_MS:5000}
payment.outbox.publisher.read-timeout-ms=${PAYMENT_OUTBOX_PUBLISHER_READ_TIMEOUT_MS:10000}

payment.webhook.recovery.enabled=${PAYMENT_WEBHOOK_RECOVERY_ENABLED:true}
payment.webhook.recovery.fixed-delay=${PAYMENT_WEBHOOK_RECOVERY_FIXED_DELAY:30000}
payment.webhook.recovery.batch-size=${PAYMENT_WEBHOOK_RECOVERY_BATCH_SIZE:10}
payment.webhook.recovery.lease-seconds=${PAYMENT_WEBHOOK_RECOVERY_LEASE_SECONDS:60}
payment.webhook.recovery.max-attempts=${PAYMENT_WEBHOOK_RECOVERY_MAX_ATTEMPTS:5}
