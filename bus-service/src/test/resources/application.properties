server.port=8082
spring.application.name=bus-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_bus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

seat.hold.duration.minutes=15
booking.service.url=http://localhost:8084
payment.service.url=http://localhost:8085
jwt.secret=${JWT_SECRET:TestJwtSecretKeyForAutomatedUnitTestVerificationOnly1234567890}

server.error.include-message=always

app.upload.dir=target/test-uploads/buses
bus.outbox.publisher.enabled=false
notification.service.url=http://localhost:8086
auth.service.url=http://localhost:8081
