server.port=8082
spring.application.name=bus-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_bus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

seat.hold.duration.minutes=${SEAT_HOLD_DURATION_MINUTES:15}
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8084}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
jwt.secret=${JWT_SECRET:}

server.error.include-message=always

# Multipart & Bus Image Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/buses}

# Notification Service Integration & Outbox
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
bus.outbox.publisher.enabled=${BUS_OUTBOX_PUBLISHER_ENABLED:true}
bus.outbox.publisher.batch-size=${BUS_OUTBOX_PUBLISHER_BATCH_SIZE:20}
bus.outbox.publisher.lease-seconds=${BUS_OUTBOX_PUBLISHER_LEASE_SECONDS:60}
bus.outbox.publisher.fixed-delay=${BUS_OUTBOX_PUBLISHER_FIXED_DELAY:2000}

# Auth Service URL for Operator Resolution
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
