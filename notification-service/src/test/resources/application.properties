server.port=8086
spring.application.name=notification-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dedicated test signing secret for automated test suites
jwt.secret=${JWT_SECRET:TestJwtSecretKeyForAutomatedTestVerificationOnly1234567890}

resend.api.key=
resend.from=TravelEasy <notifications@mailer.gsrgroups.tech>
resend.simulation.enabled=true

# Disable rapid background polling during unit/integration tests
notification.delivery.fixed-delay=3600000
notification.retention.cron=0 0 0 1 1 ?
