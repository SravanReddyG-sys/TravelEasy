server.port=8088
spring.application.name=traveller-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_traveller_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:}

booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8084}
bus.service.url=${BUS_SERVICE_URL:http://localhost:8082}
hotel.service.url=${HOTEL_SERVICE_URL:http://localhost:8083}
