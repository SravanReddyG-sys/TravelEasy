server.port=8084
spring.application.name=booking-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Gsravanreddy@7989}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:TestSecretKeyForBookingServiceTesting1234567890}

bus.service.url=http://localhost:8082
hotel.service.url=http://localhost:8083
payment.service.url=http://localhost:8085
notification.service.url=http://localhost:8086

booking.outbox.publisher.enabled=false
booking.outbox.publisher.batch-size=20
booking.outbox.publisher.lease-seconds=60
booking.outbox.publisher.fixed-delay=3600000

booking.hotel.inventory-release.reconciliation.enabled=false
booking.hotel.inventory-release.reconciliation.batch-size=10
booking.hotel.inventory-release.reconciliation.lease-seconds=60
booking.hotel.inventory-release.reconciliation.fixed-delay=3600000

booking.hotel.refund.reconciliation.enabled=false
booking.hotel.refund.reconciliation.batch-size=10
booking.hotel.refund.reconciliation.lease-seconds=60
booking.hotel.refund.reconciliation.fixed-delay=3600000
