server.port=8084
spring.application.name=booking-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/traveleasy_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:}

bus.service.url=${BUS_SERVICE_URL:http://localhost:8082}
hotel.service.url=${HOTEL_SERVICE_URL:http://localhost:8083}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

booking.outbox.publisher.enabled=${BOOKING_OUTBOX_PUBLISHER_ENABLED:true}
booking.outbox.publisher.batch-size=${BOOKING_OUTBOX_PUBLISHER_BATCH_SIZE:20}
booking.outbox.publisher.lease-seconds=${BOOKING_OUTBOX_PUBLISHER_LEASE_SECONDS:60}
booking.outbox.publisher.fixed-delay=${BOOKING_OUTBOX_PUBLISHER_FIXED_DELAY:2000}
